<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ToDo App</title>
</head>
<body>
    <div class="main-container">
        <div class="sidebar">
            <div class="options-menu">
                <div><button class="search">Search</button></div>
                <div><button class="today">Today</button></div>
                <div><button class="upcoming">Upcoming</button></div>
                <div><button class="all-tasks">All tasks</button></div>
            </div>

            <div class="project-list">
                <div>Current Projects <button class="create-project" commandfor="custom-dialog" command="show-modal">+</button></div>

                <dialog id="custom-dialog" class="dialog-item">
                    <h4>Add a project</h4>
                    <hr>
                    <div class="form-wrapper">
                        <form action="">
                            <div class="form-item-wrapper">
                                <div class="form-item">
                                    <div>
                                        <label for="project-name">Project Name: *</label>
                                    </div>
                                    <input type="text" name="projectName" id="project-name" required>
                                </div>
                                <div class="form-item">
                                    <div>
                                        <label for="description">Description:</label>
                                    </div>
                                    <textarea name="description" id="description" rows="4" cols="50"></textarea>
                                </div>
                            </div>
                        </form>
                    </div>
                    <hr>
                    <button commandfor="custom-dialog" command="close">Close</button>
                </dialog>
                
            </div>
            
        </div>
        <div class="main-content"></div>
    </div>
    
</body>
</html>
