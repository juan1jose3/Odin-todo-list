<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ToDo App</title>
</head>
<body>
    <div class="main-container">
        <div class="sidebar">
            <div class="options-menu">
                <div><button class="search custom-button">Search</button></div>
                <div><button class="today custom-button">Today</button></div>
                <div><button class="upcoming custom-button">Upcoming</button></div>
                <div><button class="all-tasks custom-button">All tasks</button></div>
            </div>

            <div class="project-list">
                <div>Current Projects <button class="custom-button" commandfor="custom-dialog" command="show-modal">+</button></div>
                <div class="current-projects-list"></div>
                <dialog id="custom-dialog" class="dialog-item">
                    <h4>Add a project</h4>
                    <hr>
                    <div class="form-wrapper">
                        <form class="project-form">
                            <div class="form-item-wrapper">
                                <div class="form-item">
                                    <div class="label-wrapper">
                                        <label for="project-name">Project Name: *</label>
                                    </div>
                                    <input type="text" name="projectName" id="project-name" required>
                                </div>
                                <div class="form-item">
                                    <div class="label-wrapper">
                                        <label for="description">Description:</label>
                                    </div>
                                    <textarea name="description" id="description" rows="4" cols="50"></textarea>
                                </div>
                                <hr>
                            </div>
                            <div class="form-button-container">
                                <button type="button" class="custom-button create-project">Create!</button>

                                <button type="button" commandfor="custom-dialog" command="close" class="custom-button">Close</button>
                            </div>
                        </form>
                    </div>
                    
                </dialog>

                <dialog id="task-dialog" class="dialog-item">
                    <h4>Create a new task</h4>
                    <hr>
                    <div class="form-wrapper">
                        <form class="task-form">
                            <div class="form-item-wrapper">
                                <div class="form-item">
                                     <div class="label-wrapper">
                                         <label for="task-title">Task Title: *</label>
                                     </div>
                                     <input id="task-title" type="text" name="taskTitle" required>
                                </div>
                                <div class="form-item">
                                     <div class="label-wrapper">
                                         <label for="task-description">Task Description:</label>
                                     </div>
                                     <textarea name="taskDescription" id="task-description" rows="4" cols="50"></textarea>
                                </div>
                                <div class="form-item">
                                     <div class="label-wrapper">
                                         <label for="due-date">Due Date:</label>
                                     </div>
                                     <input type="date" name="dueDate" id="due-date">
                                </div>
                                <div class="form-item">
                                     <div class="label-wrapper">
                                         <p>Task Priority:</p>
                                     </div>
                                     <div class="priority-options">
                                         <label class="priority-label high">
                                             <input id="high" type="radio" name="taskPriority" value="High">
                                             <span>High</span>
                                         </label>
     
                                         <label class="priority-label medium">
                                             <input type="radio" name="taskPriority" id="medium" value="Medium" checked>
                                             <span>Medium</span>
                                         </label>
     
                                         <label class="priority-label low">
                                             <input type="radio" name="taskPriority" id="low" value="Low">
                                             <span>Low</span>
                                         </label>
                                     </div>
                                </div>
                            </div>

                           <div class="form-button-container">
                                <button type="button" class="custom-button create-task">Create!</button>

                                <button type="button" commandfor="task-dialog" command="close" class="custom-button">Close</button>
                            </div>
                        </form>
                    </div>


                </dialog>
                
            </div>
            
        </div>
        <div class="main-content"></div>
    </div>
    
</body>
</html>
